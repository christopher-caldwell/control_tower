[workspace]
members = ["crates/application", "crates/adapters", "crates/cli"]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT"
rust-version = "1.85"

[workspace.dependencies]
control-tower-application = { path = "crates/application" }
control-tower-adapters = { path = "crates/adapters" }
clap = { version = "4.5", features = ["derive"] }
rusqlite = { version = "0.32", features = ["bundled"] }
uuid = { version = "1.11", features = ["v4"] }
