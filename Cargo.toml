[workspace]
members = ["crates/application", "crates/database", "crates/infrastructure", "crates/cli"]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT"
rust-version = "1.85"

[workspace.dependencies]
control-tower-application = { path = "crates/application" }
control-tower-database = { path = "crates/database" }
control-tower-infrastructure = { path = "crates/infrastructure" }
thiserror = "2"
clap = { version = "4.5", features = ["derive"] }
rusqlite = { version = "0.32", features = ["bundled"] }
uuid = { version = "1.11", features = ["v4"] }
axum = { version = "0.8", features = ["json"] }
rust-embed = { version = "8", features = ["debug-embed"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures-util = "0.3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time"] }
