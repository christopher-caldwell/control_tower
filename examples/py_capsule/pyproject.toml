[project]
name = "control-tower-py-capsule-examples"
version = "0.1.0"
description = "Direct composition of Control Tower stages and reusable PyCapsule tools"
requires-python = ">=3.11"
dependencies = [
    "example-tool",
    "psycopg[binary]>=3.2,<4",
    "python-dateutil>=2.9,<3",
]

[tool.uv]
package = false

[tool.uv.sources]
example-tool = { path = "tools/example_tool", editable = true }
py-capsule = { git = "ssh://git@github.com/christopher-caldwell/py_capsule.git", rev = "25edcfe51373cc2ebf0593ae5a033323f71b19e3" }
