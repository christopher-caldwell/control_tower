[project]
name = "example-tool"
version = "0.1.0"
description = "Typed facade around the PyCapsule example used by Control Tower pattern workflows"
requires-python = ">=3.11"
dependencies = ["capsule-runner==0.0.1"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
