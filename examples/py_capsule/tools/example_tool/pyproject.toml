[project]
name = "example-tool"
version = "0.1.0"
description = "Typed facade around the PyCapsule example used by Control Tower pattern workspaces"
requires-python = ">=3.11"
dependencies = ["py-capsule"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv.sources]
py-capsule = { git = "ssh://git@github.com/christopher-caldwell/py_capsule.git", rev = "25edcfe51373cc2ebf0593ae5a033323f71b19e3" }
